name: Release CardMinder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'pubspec.yaml'
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release CardMinder APKs
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Extract App Version from pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Check if version changed since previous commit
        id: version_changed
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          PREV_VERSION=""

          if [ "${{ github.event_name }}" = "push" ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD^:pubspec.yaml 2>/dev/null | grep '^version:' | cut -d ' ' -f 2 | cut -d '+' -f 1 || true)
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREV_VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ -z "$PREV_VERSION" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip release if version unchanged
        if: steps.version_changed.outputs.should_release != 'true'
        run: echo "Skipping release because the app version did not change."

      - name: Generate Commit Changelog
        if: steps.version_changed.outputs.should_release == 'true'
        id: changelog
        env:
          TAG_NAME: ${{ env.TAG_NAME }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import subprocess
          import re
          import os

          tag = os.environ.get('TAG_NAME', '')
          repo = os.environ.get('REPO_NAME', 'GamerJagdish/cardminder')

          try:
              prev_tag = subprocess.check_output(['git', 'describe', '--tags', '--abbrev=0', 'HEAD^'], encoding='utf-8').strip()
          except Exception:
              prev_tag = ''

          range_spec = f'{prev_tag}..HEAD' if prev_tag else 'HEAD'

          sep_record = '\x1e'
          sep_field = '\x1f'

          cmd = ['git', 'log', range_spec, f'--pretty=format:{sep_record}%h{sep_field}%an{sep_field}%ae{sep_field}%s{sep_field}%b']
          raw = subprocess.check_output(cmd, encoding='utf-8')
          records = [r for r in raw.split(sep_record) if r.strip()]

          def get_username(name, email):
              m = re.match(r'^[0-9]+\+([^@]+)@users\.noreply\.github\.com$', email)
              if m:
                  return m.group(1)
              if 'imgbot' in name.lower() or 'imgbot' in email.lower():
                  return 'imgbot[bot]'
              if re.match(r'^[a-zA-Z0-9_-]+$', name):
                  return name
              return 'GamerJagdish'

          commits = []
          for rec in records:
              parts = rec.strip().split(sep_field)
              if len(parts) < 4:
                  continue
              h, author, email, subj = parts[0], parts[1], parts[2], parts[3]
              body = parts[4].strip() if len(parts) > 4 else ''
              
              user = get_username(author, email)
              commit_url = f'https://github.com/{repo}/commit/{h}'
              commits.append(f'* {subj} by @{user} in {commit_url}')
              
              if body:
                  for b_line in body.split('\n'):
                      b_line = b_line.strip()
                      if not b_line:
                          continue
                      b_line = re.sub(r'^[\*\-\+]\s+', '', b_line)
                      commits.append(f'  * {b_line}')

          new_contributors = {}
          if prev_tag:
              for rec in reversed(records):
                  parts = rec.strip().split(sep_field)
                  if len(parts) < 4:
                      continue
                  h, author, email, subj = parts[0], parts[1], parts[2], parts[3]
                  user = get_username(author, email)
                  if user not in new_contributors:
                      try:
                          prior = subprocess.check_output(['git', 'log', prev_tag, f'--author={email}', '--oneline'], encoding='utf-8').strip()
                          if not prior:
                              new_contributors[user] = h
                      except Exception:
                          pass

          changelog = ["## What's Changed"]
          changelog.extend(commits)

          if new_contributors:
              changelog.append('')
              changelog.append('## New Contributors')
              for u, h in new_contributors.items():
                  changelog.append(f'* @{u} made their first contribution in https://github.com/{repo}/commit/{h}')

          changelog.append('')
          if prev_tag:
              changelog.append(f'**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}')
          else:
              changelog.append(f'**Full Changelog**: https://github.com/{repo}/commits/{tag}')

          with open('CHANGELOG_RELEASE.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(changelog) + '\n')
          print("Changelog generated successfully.")
          EOF

      - name: Decode Android Release Keystore and Config
        if: steps.version_changed.outputs.should_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          fi

      - name: Install Dependencies
        if: steps.version_changed.outputs.should_release == 'true'
        run: flutter pub get

      - name: Build Universal Release APK
        if: steps.version_changed.outputs.should_release == 'true'
        run: |
          flutter build apk --release
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/CardMinder-${{ env.VERSION }}-All-Devices-Universal.apk

      - name: Build Split-per-ABI Release APKs
        if: steps.version_changed.outputs.should_release == 'true'
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/CardMinder-${{ env.VERSION }}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_apks/CardMinder-${{ env.VERSION }}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_apks/CardMinder-${{ env.VERSION }}-x86_64.apk

      - name: Configure SSH Signing and Create Signed Tag
        if: steps.version_changed.outputs.should_release == 'true'
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          if [ -n "$SSH_SIGNING_KEY" ]; then
            echo "Configuring SSH key for signed git tag..."
            mkdir -p ~/.ssh
            trap 'rm -f ~/.ssh/id_signing' EXIT
            printf '%s\n' "$SSH_SIGNING_KEY" | tr -d '\r' > ~/.ssh/id_signing
            chmod 600 ~/.ssh/id_signing

            git config --global user.name "GamerJagdish"
            git config --global user.email "83897547+GamerJagdish@users.noreply.github.com"
            git config --global gpg.format ssh
            git config --global user.signingkey ~/.ssh/id_signing
            git config --global tag.gpgsign true

            git fetch --tags origin || true
            if ! git rev-parse "${{ env.TAG_NAME }}" >/dev/null 2>&1; then
              echo "Creating signed tag: ${{ env.TAG_NAME }}"
              git tag -s "${{ env.TAG_NAME }}" -m "Release ${{ env.TAG_NAME }}"
              git push origin "${{ env.TAG_NAME }}"
            else
              echo "Tag ${{ env.TAG_NAME }} already exists."
            fi

            rm -f ~/.ssh/id_signing
            echo "SSH signing key cleaned up successfully."
          else
            echo "SSH_SIGNING_KEY secret not set. Skipping signed tag creation."
          fi

      - name: Attest APK Artifacts
        if: steps.version_changed.outputs.should_release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release_apks/*.apk'

      - name: Create or Update GitHub Release
        if: steps.version_changed.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release_apks/CardMinder-${{ env.VERSION }}-All-Devices-Universal.apk
            release_apks/CardMinder-${{ env.VERSION }}-arm64-v8a.apk
            release_apks/CardMinder-${{ env.VERSION }}-armeabi-v7a.apk
            release_apks/CardMinder-${{ env.VERSION }}-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
