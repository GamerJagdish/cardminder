name: Release CardMinder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'pubspec.yaml'
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release CardMinder APKs
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract App Version from pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Check if version changed since previous commit
        id: version_changed
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          PREV_VERSION=""

          if [ "${{ github.event_name }}" = "push" ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD^:pubspec.yaml 2>/dev/null | grep '^version:' | cut -d ' ' -f 2 | cut -d '+' -f 1 || true)
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREV_VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ -z "$PREV_VERSION" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip release if version unchanged
        if: steps.version_changed.outputs.should_release != 'true'
        run: echo "Skipping release because the app version did not change."

      - name: Generate Commit Changelog
        if: steps.version_changed.outputs.should_release == 'true'
        id: changelog
        run: |
          echo "Generating changelog..."
          
          # Find previous tag if available
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          
          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag found: $PREV_TAG"
            LOG_RANGE="$PREV_TAG..HEAD"
          else
            echo "No previous tag found. Generating log from initial commit."
            LOG_RANGE="HEAD"
          fi

          # Format git commits with full title and description
          CHANGELOG_FILE="CHANGELOG_RELEASE.md"
          echo "## What's Changed in $VERSION" > $CHANGELOG_FILE
          echo "" >> $CHANGELOG_FILE
          
          if [ "$LOG_RANGE" = "HEAD" ]; then
            git log --pretty=format:"* **%s**%n%b" >> $CHANGELOG_FILE
          else
            git log $LOG_RANGE --pretty=format:"* **%s**%n%b" >> $CHANGELOG_FILE
          fi
          
          echo "" >> $CHANGELOG_FILE

      - name: Decode Android Release Keystore and Config
        if: steps.version_changed.outputs.should_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=${KEYSTORE_PASSWORD:-cardminder2026}" > android/key.properties
            echo "keyPassword=${KEY_PASSWORD:-cardminder2026}" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-upload}" >> android/key.properties
            echo "storeFile=app/upload-keystore.jks" >> android/key.properties
          fi

      - name: Install Dependencies
        if: steps.version_changed.outputs.should_release == 'true'
        run: flutter pub get

      - name: Build Universal Release APK
        if: steps.version_changed.outputs.should_release == 'true'
        run: |
          flutter build apk --release
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/CardMinder-${{ env.VERSION }}-All-Devices-Universal.apk

      - name: Build Split-per-ABI Release APKs
        if: steps.version_changed.outputs.should_release == 'true'
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/CardMinder-${{ env.VERSION }}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_apks/CardMinder-${{ env.VERSION }}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_apks/CardMinder-${{ env.VERSION }}-x86_64.apk

      - name: Create or Update GitHub Release
        if: steps.version_changed.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release_apks/CardMinder-${{ env.VERSION }}-All-Devices-Universal.apk
            release_apks/CardMinder-${{ env.VERSION }}-arm64-v8a.apk
            release_apks/CardMinder-${{ env.VERSION }}-armeabi-v7a.apk
            release_apks/CardMinder-${{ env.VERSION }}-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
